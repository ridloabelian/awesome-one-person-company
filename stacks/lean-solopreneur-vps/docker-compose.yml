services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solopreneur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password}
      POSTGRES_DB: ${POSTGRES_DB:-solopreneur_core}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sql:/docker-entrypoint-initdb.d/init-multiple-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-solopreneur}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # 1. Back-Office Automation & AI Agent Brain (Zapier/Make Alternative)
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-solopreneur}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-changeme_strong_password}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-replace_with_random_32_char_secret}
      - GENERIC_TIMEZONE=${TZ:-Asia/Jakarta}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  # 2. Privacy-First Product & Web Analytics (Google Analytics Replacement)
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-solopreneur}:${POSTGRES_PASSWORD:-changeme_strong_password}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-replace_with_random_secret}
    depends_on:
      postgres:
        condition: service_healthy

  # 3. High-Performance Newsletter & Mailing List Manager
  listmonk:
    image: listmonk/listmonk:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
    command: [sh, -c, "./listmonk --install --idempotent --yes --config='' && ./listmonk --config=''"]
    environment:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__host: postgres
      LISTMONK_db__port: 5432
      LISTMONK_db__user: ${POSTGRES_USER:-solopreneur}
      LISTMONK_db__password: ${POSTGRES_PASSWORD:-changeme_strong_password}
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
      TZ: ${TZ:-Asia/Jakarta}
    depends_on:
      postgres:
        condition: service_healthy

  # 4. Self-Hosted Uptime Monitor & Public Status Page
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - "3002:3001"
    volumes:
      - uptime_kuma_data:/app/data

  # 5. Self-Hosted WhatsApp HTTP API + MCP Server
  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - WAHA_DASHBOARD_ENABLED=true
    volumes:
      - waha_data:/app/.sessions

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  uptime_kuma_data:
  waha_data:
